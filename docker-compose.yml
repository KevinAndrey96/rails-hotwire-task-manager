services:
  web:
    build: .
    image: rails-hotwire-task-manager
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env, see .env.example}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      APP_HOST: ${APP_HOST:-localhost}
      MAILER_FROM: ${MAILER_FROM:-Gestor de tareas <no-reply@example.com>}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - storage:/rails/storage
    restart: unless-stopped

volumes:
  storage:
